# pyproject.toml — PEP 621 project metadata for hao-backprop-test
#
# This manifest mirrors the metadata from the retired `package.json`
# manifest of the previous implementation (see AAP §0.4.1) and serves as
# the canonical project descriptor for the Python/Flask reimplementation
# of the Hello-World HTTP server.
#
# Runtime dependencies are *also* pinned in requirements.txt to preserve
# the AAP §0.5.2 versions for tools that prefer `pip install -r ...`;
# the [project.dependencies] table below duplicates those pins so that
# tools consuming pyproject.toml directly (e.g. `pip install .`,
# `build`, `twine`) see the same dependency set.
#
# Field-by-field mapping from the retired package.json (verbatim from
# version-control history — only the Python target values are current):
#   "name":        "hello_world"          -> [project] name        = "hello_world"
#   "version":     "1.0.0"                -> [project] version     = "1.0.0"
#   description (retired stack reference)  -> [project] description = "Hello world in Python (Flask)"
#   "main":        "index.js"             -> (no TOML equivalent; replaced by
#                                              [tool.setuptools.packages.find] package layout)
#   "scripts":     { "test": "..." }      -> (no TOML equivalent; replaced by
#                                              [tool.pytest.ini_options] -> invoke via `pytest`)
#   "author":      "hxu"                  -> [project] authors     = [{ name = "hxu" }]
#   "license":     "MIT"                  -> [project] license     = { text = "MIT" }
#
# A new field absent from package.json — `requires-python = ">=3.12"` —
# is added per AAP §0.3.1 to lock the runtime to Python 3.12+.

[build-system]
# setuptools is the de-facto default PEP 517 build backend for application
# projects that don't need anything more exotic; pinning to >=68 ensures
# native support for PEP 621 metadata (license-as-table) and modern
# packaging features used below. `wheel` is required so that
# `pip install .` and `python -m build` can produce wheel artifacts.
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Mirrors retired package.json:L2 ("name": "hello_world").
name = "hello_world"

# Mirrors retired package.json:L3 ("version": "1.0.0").
version = "1.0.0"

# Refactored from the retired package.json description field per AAP §0.4.1
# transformation rule: description becomes the Python/Flask variant.
description = "Hello world in Python (Flask)"

# Pointer to the human-readable README. README.md exists at the repo root
# and is updated by the same refactor (AAP §0.4.1 row "README.md").
readme = "README.md"

# Added per AAP §0.3.1 Role Specification (no equivalent in the original
# package.json). Locks the project to Python 3.12+ — the runtime the
# refactor was developed and tested against, also recorded in
# `.python-version` for `pyenv`/`asdf` consumers.
requires-python = ">=3.12"

# Mirrors retired package.json:L10 ("license": "MIT"). PEP 621 prefers
# `license = { text = "..." }` (legacy form) or `license-files = [...]`
# (PEP 639). The legacy form is used here for broad compatibility with
# setuptools >=68 and downstream packaging tools that haven't fully
# adopted PEP 639 yet.
license = { text = "MIT" }

# Mirrors retired package.json:L9 ("author": "hxu"). PEP 621 represents
# authors as a list of {name, email?} tables — there was no email in the
# original metadata, so only `name` is provided.
authors = [
    { name = "hxu" },
]

# Discovery hints for PyPI / package indexers. Not present in the
# original package.json, but added here so that the new manifest is a
# complete, idiomatic PEP 621 descriptor.
keywords = ["flask", "hello-world", "wsgi", "backprop", "test-fixture"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: Flask",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]

# --- Runtime dependencies ---------------------------------------------------
#
# Every pin below is an *exact* version match (==). Most pins match the
# AAP §0.5.2 baseline values; two pins (Werkzeug, python-dotenv) have
# been upgraded above the AAP §0.5.2 baseline at Checkpoint 3 final
# review in response to published security advisories. Per-package
# comments below cite the specific advisory IDs. Security requirements
# at the final checkpoint supersede static AAP §0.5.2 pin fidelity (the
# AAP is updated implicitly by this remediation). The byte-for-byte
# HTTP parity guarantee is preserved: behavioral parity is enforced by
# the test suite, not by the specific patch version of Werkzeug or
# python-dotenv. Loosening any pin (e.g. to ~= or >=) is still
# forbidden — `==` is mandatory for reproducible builds.
#
# These mirror requirements.txt; the two files are complementary
# (requirements.txt is the pip-install-r target, pyproject.toml is the
# canonical project metadata for `pip install .`, `build`, `twine`, etc.).
# Both manifests pin the same exact versions for every package below.
dependencies = [
    # Flask 3.1.3 — primary web framework. Replaces the retired
    # implementation's built-in HTTP module. Pinned exactly per AAP §0.5.2.
    "Flask==3.1.3",
    # Werkzeug 3.1.8 — Flask's WSGI utility library. The AAP §0.5.2
    # baseline pin was 3.1.3, but that version is affected by published
    # security advisories:
    #   - CVE-2025-66221 (safe_join behavior; fixed in 3.1.4)
    #   - CVE-2026-21860 (fixed in 3.1.5)
    # Snyk advisory data also lists 3.1.3 with multiple direct
    # vulnerabilities while 3.1.8 has zero direct vulnerabilities.
    # Upgraded to 3.1.8 at Checkpoint 3 final review to remediate these
    # findings; kept in lock-step with requirements.txt.
    "Werkzeug==3.1.8",
    # python-dotenv 1.2.2 — loads .env into os.environ; supports the
    # rule-mandated "environment config" requirement (AAP §0.7.3). The
    # AAP §0.5.2 baseline pin was 1.0.1, but that version is affected
    # by GHSA-mf9w-mj56-hr94 / CVE-2026-28684 (symlink-following file
    # overwrite in set_key()/unset_key() via a cross-device rename
    # fallback). The patched version is 1.2.2. Upgraded at Checkpoint
    # 3 final review; kept in lock-step with requirements.txt.
    "python-dotenv==1.2.2",
    # gunicorn 23.0.0 — pre-fork POSIX WSGI server (the primary
    # production-deployment translation per AAP §0.6.5). The
    # `sys_platform != 'win32'` environment marker matches
    # requirements.txt and prevents pip from attempting to install
    # gunicorn on Windows, where it is unsupported.
    "gunicorn==23.0.0 ; sys_platform != 'win32'",
    # waitress 3.0.2 — cross-platform WSGI server; Windows fallback
    # when gunicorn is unavailable (AAP §0.5.2).
    "waitress==3.0.2",
]

[project.optional-dependencies]
# Test extras — installable via `pip install -e .[test]`. Mirrors the
# AAP §0.5.2 testing tools and is kept as an optional extra so the
# runtime install footprint stays minimal in production deployments.
#
# pytest 9.0.3 — runs the parity test suite (development-only dependency).
# The AAP §0.5.2 baseline pin was 8.4.2, but that version is affected by
# CVE-2025-71176 / GHSA-6w46-j5rx-g56g (MEDIUM, CVSS 6.8) — a /tmp
# directory name-pattern issue that allows local users to cause a denial
# of service or possibly gain privileges. The patched version is 9.0.3.
# Upgraded at Checkpoint 7 final review; kept in lock-step with
# requirements.txt. Following the same defense-in-depth precedent
# established at Checkpoint 3 final review for Werkzeug (3.1.3 -> 3.1.8)
# and python-dotenv (1.0.1 -> 1.2.2). Verified compatible with
# pytest-flask 1.3.0 (which declares `pytest >=5.2` as its minimum
# supported version) and with Python 3.12 (pytest 9.0.3 declares
# `Requires-Python: >=3.10`).
test = [
    "pytest==9.0.3",
    "pytest-flask==1.3.0",
]

# --- Project URLs (informational; absent from package.json) -----------------
# No URLs were declared in the retired package.json [package.json:L1-L11],
# so no [project.urls] table is added here — the source-of-truth
# `package.json` metadata had no URL fields to translate.

# --- Setuptools-specific configuration --------------------------------------

[tool.setuptools.packages.find]
# Replaces the retired `"main": "index.js"` field from package.json:L5
# (which referenced a file that never existed [§1.2.2]). Python's
# preferred mechanism is package discovery: the `app` package (and any
# nested subpackages, indicated by the trailing `*`) is the importable
# project payload. The `tests` package is explicitly excluded so it is
# not installed alongside the app when the project is built into a
# wheel.
include = ["app*"]
exclude = ["tests*"]

# --- Pytest configuration ---------------------------------------------------

[tool.pytest.ini_options]
# Replaces the retired `"scripts": { "test": "echo ... && exit 1" }` block
# from package.json:L6-L8. Configuring pytest here means contributors
# can run the parity test suite with a bare `pytest` (no command-line
# arguments needed), which is what README.md documents.
testpaths = ["tests"]
python_files = ["test_*.py"]
# `-ra` shows a short summary of all non-passing outcomes (errors,
# failures, skips, xfails, xpasses) — useful for parity diagnostics.
# `-q` keeps the output concise (quiet mode) so CI logs stay readable.
addopts = "-ra -q"
